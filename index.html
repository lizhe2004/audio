<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remotion 音效试听库 | Sound Effects Player</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔊</text></svg>">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(20, 27, 45, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --card-active-border: #6366f1;
      --card-active-bg: rgba(99, 102, 241, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --cyan: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 10% 20%, #151a30 0%, #090d16 80%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 120px;
      line-height: 1.5;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .logo-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-title p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .badge-count {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      user-select: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border-color: var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .btn-stop {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border-color: rgba(244, 63, 94, 0.3);
    }

    .btn-stop:hover {
      background: rgba(244, 63, 94, 0.25);
    }

    /* Main Container */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Controls Bar */
    .controls-wrapper {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 38px 10px 42px;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .clear-search {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: none;
      padding: 4px;
    }
    .clear-search:hover {
      color: var(--text-main);
    }

    .sort-box select {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    .sort-box select option {
      background: #111827;
      color: #fff;
    }

    .mode-toggle {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .mode-btn {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    /* Filter Tabs */
    .tabs-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tab-chip:hover {
      background: rgba(255, 255, 255, 0.09);
      color: var(--text-main);
    }

    .tab-chip.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.45);
      color: #c7d2fe;
    }

    .tab-count {
      font-size: 0.72rem;
      opacity: 0.7;
    }

    /* Grid */
    .sounds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    /* Sound Card */
    .sound-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: visible;
      cursor: pointer;
    }

    .sound-card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .sound-card.playing {
      border-color: var(--card-active-border);
      background: var(--card-active-bg);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .play-trigger {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .sound-card:hover .play-trigger {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .sound-card.playing .play-trigger {
      background: var(--emerald);
      border-color: var(--emerald);
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
    }

    .card-info {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-filename {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin-top: 1px;
    }

    .fav-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      transition: all 0.15s;
    }
    .fav-btn:hover {
      color: var(--amber);
      transform: scale(1.15);
    }
    .fav-btn.active {
      color: var(--amber);
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.25rem;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .meta-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .meta-pill {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      font-family: monospace;
    }

    .tag-pill {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(99, 102, 241, 0.12);
      color: #a5b4fc;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-icon-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      padding: 5px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .action-icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    /* Card Progress Bar */
    .card-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #10b981);
      width: 0%;
      transition: width 0.1s linear;
    }

    .analysis-hint {
      color: #a5b4fc;
      font-size: 0.7rem;
      white-space: nowrap;
    }

    .analysis-tooltip {
      position: fixed;
      z-index: 100;
      width: min(420px, calc(100vw - 28px));
      max-height: min(600px, calc(100vh - 28px));
      overflow: auto;
      padding: 16px;
      border: 1px solid rgba(129, 140, 248, 0.52);
      border-radius: 14px;
      background: rgba(12, 18, 34, 0.97);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(18px);
      color: var(--text-main);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.14s ease, transform 0.14s ease;
    }

    .analysis-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .analysis-tooltip h3 {
      font-size: 0.9rem;
      margin-bottom: 10px;
      color: #e0e7ff;
    }

    .analysis-tooltip-section {
      margin-top: 10px;
    }

    .analysis-tooltip-label {
      display: block;
      margin-bottom: 3px;
      color: #a5b4fc;
      font-size: 0.69rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .analysis-tooltip p,
    .analysis-tooltip li {
      color: var(--text-muted);
      font-size: 0.76rem;
      line-height: 1.55;
    }

    .analysis-tooltip ul {
      padding-left: 16px;
    }

    .analysis-confidence {
      display: inline-flex;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      font-size: 0.7rem;
    }

    /* Waveform Animation */
    .wave-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }

    .wave-bars span {
      width: 2px;
      background: #10b981;
      border-radius: 1px;
      animation: jump 0.8s ease-in-out infinite;
    }
    .wave-bars span:nth-child(1) { height: 40%; animation-delay: 0.1s; }
    .wave-bars span:nth-child(2) { height: 80%; animation-delay: 0.3s; }
    .wave-bars span:nth-child(3) { height: 60%; animation-delay: 0.2s; }
    .wave-bars span:nth-child(4) { height: 100%; animation-delay: 0.4s; }

    @keyframes jump {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* Bottom Player Bar */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(13, 18, 32, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 240px;
      max-width: 320px;
    }

    .player-visualizer {
      width: 48px;
      height: 40px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #visCanvas {
      width: 100%;
      height: 100%;
    }

    .player-track-info {
      min-width: 0;
    }

    .player-track-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-track-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: monospace;
    }

    .player-center {
      flex: 1;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.15s;
    }

    .ctrl-btn:hover {
      color: var(--text-main);
      transform: scale(1.08);
    }

    .ctrl-btn.active {
      color: var(--accent);
    }

    .ctrl-play {
      width: 40px;
      height: 40px;
      background: var(--accent);
      color: #fff !important;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .ctrl-play:hover {
      transform: scale(1.08);
      filter: brightness(1.1);
    }

    .player-timeline {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-label {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-family: monospace;
      width: 38px;
      text-align: center;
    }

    .scrubber {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      position: relative;
    }

    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s;
    }

    .scrubber::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .player-right {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 200px;
      justify-content: flex-end;
    }

    .speed-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      outline: none;
    }
    .speed-select option {
      background: #111827;
    }

    .volume-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume-slider {
      width: 75px;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-main);
      cursor: pointer;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Responsive */
    @media (max-width: 860px) {
      .player-right {
        display: none;
      }
      .player-left {
        min-width: 140px;
      }
      .header-actions .btn-secondary span {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .header-inner {
        padding: 12px 16px;
      }
      .container {
        padding: 16px;
      }
      .sounds-grid {
        grid-template-columns: 1fr;
      }
      .player-bar {
        padding: 10px 14px;
      }
      .player-visualizer {
        display: none;
      }
      .player-left {
        min-width: 110px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="logo-group">
        <div class="logo-icon">🔊</div>
        <div class="logo-title">
          <h1>
            Remotion 音效试听库
            <span class="badge-count" id="totalCountBadge">加载中</span>
          </h1>
          <p>所有本地音效均可离线试听；悬停卡片可查看基于音频内容生成的分析、适用场景与实现建议。</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="playRandom()" title="随机播放一个音效">
          🎲 <span>随机试听</span>
        </button>
        <button class="btn btn-stop" onclick="stopAllAudio()" title="按 Esc 键亦可立即停止">

    function getFilteredSounds() {
      let list = SOUNDS_DATA.filter(item => {
        // Category
        if (currentCategory === 'favorites') {
          if (!favorites.has(item.id)) return false;
        } else if (currentCategory !== 'all') {
          if (item.category !== currentCategory) return false;
        }

        // Search
        if (currentSearch) {
          const matchTitle = item.title.toLowerCase().includes(currentSearch);
          const matchEn = (item.enTitle || '').toLowerCase().includes(currentSearch);
          const matchFile = item.name.toLowerCase().includes(currentSearch);
          const matchDesc = (item.desc || '').toLowerCase().includes(currentSearch);
          const matchTags = (item.tags || []).some(t => t.toLowerCase().includes(currentSearch));
          const matchAnalysis = [
            item.analysis?.audibleDescription,
            item.analysis?.likelySource,
            item.analysis?.speechOrMusic,
            item.analysis?.uncertainty,
            item.scenarioSearch,
          ].filter(Boolean).join(' ').toLowerCase().includes(currentSearch);
          if (!matchTitle && !matchEn && !matchFile && !matchDesc && !matchTags && !matchAnalysis) {
            return false;
          }
        }

        return true;
      });

      // Sort
      if (currentSort === 'name-asc') {
        list.sort((a, b) => a.name.localeCompare(b.name));
      } else if (currentSort === 'size-desc') {
        list.sort((a, b) => (b.sizeBytes || 0) - (a.sizeBytes || 0));
      } else if (currentSort === 'size-asc') {
        list.sort((a, b) => (a.sizeBytes || 0) - (b.sizeBytes || 0));
      } else if (currentSort === 'duration-desc') {
        list.sort((a, b) => (b.durationSec || 0) - (a.durationSec || 0));
      } else if (currentSort === 'duration-asc') {
        list.sort((a, b) => (a.durationSec || 0) - (b.durationSec || 0));
      }

      return list;
    }

        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      if (!Array.isArray(items) || items.length === 0) return `<p>${escapeHtml(emptyText)}</p>`;

      if (event) event.stopPropagation();

      if (!sound) return;

      // In Solo mode, if active and playing, toggle pause

        // Stop previous
        stopAllAudio(false);

        // Create new audio

        audio.volume = isMuted ? 0 : currentVolume;

        activeSoundId = id;

          if (activeAudio === audio) {

        audio.addEventListener('ended', () => {
          if (!isLooping) {
            updateUIPlayState(id, false);
            resetProgressBar(id);
          }
        });

        audio.play().then(() => {
          updateUIPlayState(id, true);

      } else {

      // Update cards
      document.querySelectorAll('.sound-card').forEach(c => {
        if (playMode === 'solo') c.classList.remove('playing');
      });

      const card = document.getElementById('card-' + id);
      if (card) {
        card.classList.toggle('playing', isPlaying);
        const trigger = card.querySelector('.play-trigger');
        if (trigger) trigger.innerHTML = isPlaying ? getPauseSvg() : getPlaySvg();
      }

      updateBarPlayIcon(isPlaying);
    }

    function updateBarPlayIcon(isPlaying) {
      barPlayIcon.innerHTML = isPlaying 
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' 
        : '<path d="M8 5v14l11-7z"/>';
    }

    function updateBarTrackInfo(sound) {
      barTitle.textContent = sound.title + ' (' + sound.name + ')';
      barSub.textContent = sound.desc || sound.enTitle || '';
      durationLabel.textContent = formatTime(sound.durationSec || 0);
    }

    function updateProgress(curr, dur, id) {
      if (!dur || isNaN(dur)) return;
      const pct = (curr / dur) * 100;
      currentTimeLabel.textContent = formatTime(curr);
      durationLabel.textContent = formatTime(dur);
      timelineScrubber.value = pct;

      const prog = document.getElementById('prog-' + id);
      if (prog) prog.style.width = pct + '%';
    }

    function resetProgressBar(id) {
      const prog = document.getElementById('prog-' + id);
      if (prog) prog.style.width = '0%';
      timelineScrubber.value = 0;
      currentTimeLabel.textContent = '0:00';
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function onScrub(val) {
      if (activeAudio && activeAudio.duration) {
        activeAudio.currentTime = (val / 100) * activeAudio.duration;
      }
    }

    function togglePlayActive() {
      if (activeAudio) {
        if (activeAudio.paused) {
          activeAudio.play();
          updateUIPlayState(activeSoundId, true);
        } else {
          activeAudio.pause();
          updateUIPlayState(activeSoundId, false);
        }
      } else {
        // Play first sound
        const filtered = getFilteredSounds();
        if (filtered.length > 0) togglePlay(filtered[0].id);
      }
    }

    function playPrev() {
      const list = getFilteredSounds();
      if (list.length === 0) return;
      let idx = list.findIndex(s => s.id === activeSoundId);
      idx = (idx - 1 + list.length) % list.length;
      togglePlay(list[idx].id);
    }

    function playNext() {
      const list = getFilteredSounds();
      if (list.length === 0) return;
      let idx = list.findIndex(s => s.id === activeSoundId);
      idx = (idx + 1) % list.length;
      togglePlay(list[idx].id);
    }

    function playRandom() {
      const list = getFilteredSounds();
      if (list.length === 0) return;
      const randIdx = Math.floor(Math.random() * list.length);
      togglePlay(list[randIdx].id);
      showToast('🎲 随机播放：' + list[randIdx].title);
    }

    function toggleLoop() {
      isLooping = !isLooping;
      loopBtn.classList.toggle('active', isLooping);
      if (activeAudio) activeAudio.loop = isLooping;
      showToast(isLooping ? '🔁 已开启单曲循环' : '➡️ 已关闭循环');
    }

    function stopAllAudio(showNotice = true) {
      if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
      }
      document.querySelectorAll('.sound-card').forEach(c => {
        c.classList.remove('playing');
        const trigger = c.querySelector('.play-trigger');
        if (trigger) trigger.innerHTML = getPlaySvg();
        const prog = c.querySelector('.card-progress');
        if (prog) prog.style.width = '0%';
      });
      updateBarPlayIcon(false);
      timelineScrubber.value = 0;
      currentTimeLabel.textContent = '0:00';
      if (showNotice) showToast('⏹️ 已停止所有音频播放');
    }

    function changeVolume(v) {
      currentVolume = parseFloat(v);
      isMuted = false;
      if (activeAudio) activeAudio.volume = currentVolume;
      updateVolumeIcon();
    }

    function toggleMute() {
      isMuted = !isMuted;
      if (activeAudio) activeAudio.volume = isMuted ? 0 : currentVolume;
      volumeSlider.value = isMuted ? 0 : currentVolume;
      updateVolumeIcon();
    }

    function updateVolumeIcon() {
      const icon = document.getElementById('volumeIcon');
      if (isMuted || currentVolume === 0) {
        icon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
      } else {
        icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
      }
    }

    function changePlaybackRate(rate) {
      playbackRate = parseFloat(rate);
      if (activeAudio) activeAudio.playbackRate = playbackRate;
      showToast('⚡ 播放倍速已设为 ' + rate + 'x');
    }

    function toggleFavorite(id, event) {
      event.stopPropagation();
      if (favorites.has(id)) {
        favorites.delete(id);
        showToast('已取消收藏');
      } else {
        favorites.add(id);
        showToast('⭐ 已加入收藏');
      }
      localStorage.setItem('remotion_favs', JSON.stringify([...favorites]));
      updateCategoryCounts();
      renderCards();
    }

    function copyPath(path, event) {
      event.stopPropagation();
      navigator.clipboard.writeText(path).then(() => {
        showToast('📋 已复制路径: ' + path);
      }).catch(() => {
        showToast('路径: ' + path);
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toastBox');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => {
        t.classList.remove('show');
      }, 2200);
    }

    function drawBar(ctx, x, y, w, h, r) {
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.fill();
      } else {
        ctx.fillRect(x, y, w, h);
      }
    }
    // Setup Web Audio Visualizer
    function setupVisualizer() {
      drawIdleVisualizer();
    }

    function connectAudioToVisualizer(audio) {
      // file:// 下 createMediaElementSource 不会抛异常，但音源会因 CORS 输出静音
      // （控制台报 "MediaElementAudioSource outputs zeroes"）。
      // 此时直接用 <audio> 原生播放，可视化用程序动画兜底；
      // 需要真实频谱可通过本地服务器打开（如 python3 -m http.server）。
      if (location.protocol === 'file:') {
        analyser = null;
        sourceNode = null;
        startVisualizerLoop();
        return;
      }
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        // If createMediaElementSource fails, fallback to smooth procedural animation
        if (!audio._sourceConnected) {
          try {
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            sourceNode = audioCtx.createMediaElementSource(audio);
            sourceNode.connect(analyser);
            analyser.connect(audioCtx.destination);
            audio._sourceConnected = true;
          } catch (e) {
            console.log('Using simulated visualizer:', e);
          }
        }

        startVisualizerLoop();
      } catch (err) {
        console.log('Visualizer init failed:', err);
      }
    }

    function startVisualizerLoop() {
      if (animId) cancelAnimationFrame(animId);

      const bufferLength = analyser ? analyser.frequencyBinCount : 16;
      const dataArray = new Uint8Array(bufferLength);

      function render() {
        animId = requestAnimationFrame(render);
        canvasCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);

        const isPlaying = activeAudio && !activeAudio.paused;
        if (analyser && isPlaying) {
          analyser.getByteFrequencyData(dataArray);
        }

        const bars = 8;
        const barWidth = 8;
        const gap = 4;
        const totalW = bars * barWidth + (bars - 1) * gap;
        let startX = (visCanvas.width - totalW) / 2;

        for (let i = 0; i < bars; i++) {
          let h;
          if (isPlaying) {
            if (analyser && dataArray[i]) {
              h = (dataArray[i] / 255) * (visCanvas.height - 10) + 4;
            } else {
              // Procedural wave
              const t = Date.now() / 150 + i * 0.8;
              h = Math.sin(t) * 15 + 20;
            }
          } else {
            h = 4;
          }

          const grad = canvasCtx.createLinearGradient(0, visCanvas.height, 0, 0);
          grad.addColorStop(0, '#6366f1');
          grad.addColorStop(1, '#10b981');

          canvasCtx.fillStyle = isPlaying ? grad : 'rgba(255, 255, 255, 0.2)';
          canvasCtx.beginPath();
          drawBar(canvasCtx, startX + i * (barWidth + gap), visCanvas.height - h - 4, barWidth, h, 3);
        }
      }
      render();
    }

    function drawIdleVisualizer() {
      canvasCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);
      const bars = 8;
      const barWidth = 8;
      const gap = 4;
      const totalW = bars * barWidth + (bars - 1) * gap;
      let startX = (visCanvas.width - totalW) / 2;
      for (let i = 0; i < bars; i++) {
        canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        canvasCtx.beginPath();
        drawBar(canvasCtx, startX + i * (barWidth + gap), visCanvas.height - 10, barWidth, 6, 2);
      }
    }

    // Keyboard Shortcuts
    function setupKeyboard() {
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        if (e.code === 'Space') {
          e.preventDefault();
          togglePlayActive();
        } else if (e.code === 'Escape') {
          stopAllAudio();
        } else if (e.key === 'p' || e.key === 'P') {
          playPrev();
        } else if (e.key === 'n' || e.key === 'N') {
          playNext();
        } else if (e.key === 'r' || e.key === 'R') {
          playRandom();
        }
      });
    }
  </script>
